name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal + DMG)
        run: |
          ARCHS="arm64 x86_64" MAKE_DMG=1 ./build.sh

      - name: Verify bundle
        run: |
          codesign --verify --strict SakuraVeil.app
          lipo -info SakuraVeil.app/Contents/MacOS/SakuraVeil

      # 打 tag 推送时：打包并发布 Release
      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          ditto -c -k --keepParent SakuraVeil.app dist/SakuraVeil.app.zip
          cp SakuraVeil.dmg dist/SakuraVeil.dmg
          ls -la dist/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "SakuraVeil ${GITHUB_REF_NAME}" \
            --generate-notes
